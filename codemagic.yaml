workflows:
  ios-unsigned:
    name: KaiShuiLedger unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 40
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "KaiShuiLedger.xcodeproj"
        XCODE_SCHEME: "KaiShuiLedger"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || brew upgrade xcodegen
      - name: Generate Xcode project
        script: |
          xcodegen generate
          ls -la
      - name: Build unsigned archive
        script: |
          set -e
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qry KaiShuiLedger-unsigned.ipa Payload
          ls -lh KaiShuiLedger-unsigned.ipa
    artifacts:
      - KaiShuiLedger-unsigned.ipa
      - build/App.xcarchive/Products/Applications/*.app
