name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild -project KaiShuiLedger.xcodeproj \
            -scheme KaiShuiLedger \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/KaiShuiLedger.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP=$(find build/KaiShuiLedger.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          echo "Found app: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry KaiShuiLedger-unsigned.ipa Payload
          ls -lh KaiShuiLedger-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiShuiLedger-unsigned-ipa
          path: KaiShuiLedger-unsigned.ipa
